name: Tests

# The harnesses in test/ drive a live run and assert on it; nothing ran them
# before, which is how a stale victory assertion survived a redesign unnoticed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (without the art packs)
        uses: actions/checkout@v4
        with:
          # assets/packs is ~394 MB and carries a .gdignore, so Godot never
          # reads it; build/web is a 40 MB artifact. Neither is needed to run
          # the tests, and pulling them would dominate the job.
          sparse-checkout: |
            src
            test
            scenes
            tools
            assets/audio
            assets/sprites
          lfs: false

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable-linux

      - name: Install Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Run test harnesses
        run: GODOT=~/godot/godot ./tools/run_tests.sh
