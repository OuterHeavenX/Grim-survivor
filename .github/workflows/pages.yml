name: Deploy web build to Pages

# Publishes the committed export in build/web/ as-is. The build itself is made
# locally (see README) and committed; nothing is compiled here, so this needs
# neither Godot nor the ~1.3 GB of export templates.
on:
  push:
    branches: [main]
    paths:
      - 'build/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue behind one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build/web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
